name: lifebridge_ai
description: Responsive LifeBridge AI Android and web client.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  mobile_scanner: ^7.0.1
  file_picker: ^12.0.0-beta.7
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
