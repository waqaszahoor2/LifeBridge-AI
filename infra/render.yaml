# Render Blueprint example. Create the PostgreSQL database first or adapt this
# blueprint to your account. Review current plan limits before deployment.
services:
  - type: web
    name: lifebridge-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    dockerCommand: ./docker-entrypoint.sh api
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifebridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: FORCE_HTTPS
        value: true
      - key: ENABLE_DEMO_SEED
        value: false
      - key: ENABLE_SCHEDULER
        value: false

  - type: worker
    name: lifebridge-feed-worker
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    dockerCommand: ./docker-entrypoint.sh worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lifebridge-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: lifebridge-api
          envVarKey: SECRET_KEY
      - key: ADMIN_API_KEY
        fromService:
          type: web
          name: lifebridge-api
          envVarKey: ADMIN_API_KEY
      - key: ENABLE_DEMO_SEED
        value: false
      - key: ENABLE_SCHEDULER
        value: false

databases:
  - name: lifebridge-db
    databaseName: lifebridge
    user: lifebridge
